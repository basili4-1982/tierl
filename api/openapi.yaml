        placements:
          - { item_id: 5d0f6c0e-1f55-4c1c-9d2a-0b4d6b3a1a01, tier_id: 7a1c2d3e-0000-4000-8000-000000000001 }
          - { item_id: 5d0f6c0e-1f55-4c1c-9d2a-0b4d6b3a1a02, tier_id: 7a1c2d3e-0000-4000-8000-000000000003 }
        created_at: '2026-10-22T09:30:00Z'
        updated_at: '2026-10-22T09:30:00Z'
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Машинный стабильный код (snake_case).
          examples: [validation_failed]
        message:
          type: string
          description: Текст для человека.
        details:
          type: object
          additionalProperties: true
          description: Дополнительные данные, например `fields` для ошибок валидации.
    CsrfToken:
      type: object
      required: [csrf_token]
      properties:
        csrf_token: { type: string }
    User:
      type: object
      required: [id, email, display_name, email_verified, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        display_name: { type: string, minLength: 1, maxLength: 50 }
        email_verified: { type: boolean }
        created_at: { type: string, format: date-time }
        csrf_token:
          type: string
          description: >-
            CSRF-токен сессии. Присутствует в ответах register, login и me;
            тот же токен выдаёт `GET /csrf`.
    RegisterRequest:
      type: object
      required: [email, password, display_name]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 10, maxLength: 128 }
        display_name: { type: string, minLength: 1, maxLength: 50 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token: { type: string, minLength: 1, maxLength: 256 }
        new_password: { type: string, minLength: 10, maxLength: 128 }
    Visibility:
      type: string
      enum: [public, unlisted]
    TierlistStatus:
      type: string
      enum: [open, closed]
    TierInput:
      type: object
      required: [name, color]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, pattern: '^#[0-9a-fA-F]{6}$', description: HEX-цвет тира. }
    ItemInput:
      type: object
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        image_url:
          type: [string, 'null']
          format: uri
          maxLength: 2048
    Tier:
      allOf:
        - $ref: '#/components/schemas/TierInput'
        - type: object
          required: [id, position]
          properties:
            id: { type: string, format: uuid }
            position: { type: integer, minimum: 0, description: 0 - высший тир. }
    Item:
      allOf:
        - $ref: '#/components/schemas/ItemInput'
        - type: object
          required: [id, position]
          properties:
            id: { type: string, format: uuid }
            position: { type: integer, minimum: 0 }
    AuthorRef:
      type: object
      required: [id, display_name]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: string }
    TierlistInput:
      type: object
      required: [title, visibility, tiers, items]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000, default: '' }
        visibility: { $ref: '#/components/schemas/Visibility' }
        slug:
          type: string
          pattern: '^[A-Za-z0-9_-]{3,64}$'
          description: >-
            Обязателен для public, задаётся автором. Для unlisted не передаётся:
            сервер генерирует случайный slug, переданное значение игнорируется.
        tiers:
          type: array
          minItems: 2
          maxItems: 10
          items: { $ref: '#/components/schemas/TierInput' }
        items:
          type: array
          minItems: 3
          maxItems: 50
          items: { $ref: '#/components/schemas/ItemInput' }
    TierlistPatch:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 1000 }
        visibility: { $ref: '#/components/schemas/Visibility' }
        tiers:
          type: array
          minItems: 2
          maxItems: 10
          items: { $ref: '#/components/schemas/TierInput' }
        items:
          type: array
          minItems: 3
          maxItems: 50
          items: { $ref: '#/components/schemas/ItemInput' }
    Tierlist:
      type: object
      required: [id, slug, title, description, visibility, status, tiers, items, author, is_owner, submissions_count, created_at, closed_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/TierlistStatus' }
        tiers:
          type: array
          items: { $ref: '#/components/schemas/Tier' }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        author: { $ref: '#/components/schemas/AuthorRef' }
        is_owner: { type: boolean }
        submissions_count: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
    TierlistSummary:
      type: object
      required: [id, slug, title, description, visibility, status, items_count, submissions_count, author, created_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        description: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/TierlistStatus' }
        items_count: { type: integer, minimum: 0 }
        submissions_count: { type: integer, minimum: 0 }
        cover_url: { type: [string, 'null'], format: uri }
        author: { $ref: '#/components/schemas/AuthorRef' }
        created_at: { type: string, format: date-time }
    TierlistPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TierlistSummary' }
        next_cursor: { type: [string, 'null'] }
    Placement:
      type: object
      required: [item_id, tier_id]
      properties:
        item_id: { type: string, format: uuid }
        tier_id: { type: string, format: uuid }
    SubmissionInput:
      type: object
      required: [placements]
      properties:
        placements:
          type: array
          description: >-
            Только размещённые элементы; неразмещённые считаются пропущенными
            и в сравнении не участвуют. Минимум 3 размещения (SPEC, «Ответы»).
            Каждый элемент и тир должны принадлежать опросу, элемент не повторяется.
          minItems: 3
          items: { $ref: '#/components/schemas/Placement' }
    Submission:
      type: object
      required: [id, tierlist_slug, placements, created_at, updated_at]
      properties:
        id: { type: string, format: uuid, description: "Он же id результата (/results/{id})." }
        tierlist_slug: { type: string }
        placements:
          type: array
          items: { $ref: '#/components/schemas/Placement' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SubmissionPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Submission' }
        next_cursor: { type: [string, 'null'] }
    Result:
      type: object
      required: [submission, tierlist]
      properties:
        submission: { $ref: '#/components/schemas/Submission' }
        tierlist: { $ref: '#/components/schemas/Tierlist' }
    TierCount:
      type: object
      required: [tier_id, count, percent]
      properties:
        tier_id: { type: string, format: uuid }
        count: { type: integer, minimum: 0 }
        percent: { type: number, minimum: 0, maximum: 100 }
    ItemDistribution:
      type: object
      required: [item_id, label, distribution]
      properties:
        item_id: { type: string, format: uuid }
        label: { type: string }
        distribution:
          type: array
          items: { $ref: '#/components/schemas/TierCount' }
    SimilarResult:
      type: object
      required: [result_id, similarity]
      properties:
        result_id: { type: string, format: uuid }
        similarity: { type: number, minimum: 0, maximum: 1, description: "1 - sum|ta-tb| / (N*(T-1)) по пересечению элементов." }
    ResultStats:
      type: object
      required: [total_submissions, insufficient_data, min_submissions, like_you_percent, similarity_threshold, items, similar, dissimilar]
      properties:
        total_submissions: { type: integer, minimum: 0 }
        insufficient_data: { type: boolean }
        min_submissions: { type: integer, minimum: 1 }
        like_you_percent:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Null при `insufficient_data`.
        similarity_threshold: { type: number, minimum: 0, maximum: 1 }
        items:
          type: array
          items: { $ref: '#/components/schemas/ItemDistribution' }
        similar:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/SimilarResult' }
        dissimilar:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/SimilarResult' }
