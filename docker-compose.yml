services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      TIERL_HTTP_ADDR: ":8080"
      TIERL_DATABASE_URL: "postgres://tierl:tierl@postgres:5432/tierl?sslmode=disable"
      TIERL_MIGRATE_ON_START: "true"
      # Dev-only salt; use a random secret outside local development.
      TIERL_IP_HASH_SALT: "dev-only-ip-hash-salt-change-me"
      # Local development is served over plain HTTP.
      TIERL_COOKIE_SECURE: "false"
      TIERL_PUBLIC_BASE_URL: "http://localhost:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tierl
      POSTGRES_PASSWORD: tierl
      POSTGRES_DB: tierl
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tierl -d tierl"]
      interval: 3s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  minio:
    image: cgr.dev/chainguard/minio@sha256:d88920d6a50bd0b088223b688be3b76c63e6205dbe494437f67ba1240ea12880
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tierl
      MINIO_ROOT_PASSWORD: tierl-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
