name: ci

# pull_request проверяет результат слияния с main (merge-ref). push на любую
# ветку — страховка: у конфликтующего PR merge-ref не создаётся, но проверки
# head-коммита всё равно должны появиться. Ручной прогон нужен для диагностики
# старого коммита без пустого коммита (см. docs/CI.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Не теряем прогоны в очереди и не тратим минуты на устаревший head PR.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Стражу порога покрытия нужны сообщения коммитов PR: на merge-ref
          # GitHub по умолчанию клонируется один коммит без истории.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: coverage threshold may only grow
        run: bash scripts/cover-guard.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: test
        env:
          # Postgres integration tests (testcontainers) must run in CI, not skip.
          TIERL_REQUIRE_DOCKER: "1"
        run: make cover

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t tierl:ci .
