name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Стражу порога покрытия нужны сообщения коммитов PR: на merge-ref
          # GitHub по умолчанию клонируется один коммит без истории.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: coverage threshold may only grow
        run: bash scripts/cover-guard.sh
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: test
        env:
          # Postgres integration tests (testcontainers) must run in CI, not skip.
          TIERL_REQUIRE_DOCKER: "1"
        run: make cover

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Avoid clashing with services already listening on the runner.
      TIERL_PORT: "18080"
      POSTGRES_PORT: "15432"
    steps:
      - uses: actions/checkout@v4
      - name: validate compose file
        run: docker compose config --quiet
      - name: build image
        run: docker compose build
      - name: smoke test docker compose
        run: |
          set -euo pipefail
          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              docker compose logs --no-color || true
            fi
            docker compose down -v --remove-orphans || true
            exit "$rc"
          }
          trap cleanup EXIT

          echo "==> starting compose stack"
          docker compose up -d

          pg="$(docker compose ps -q postgres)"
          for i in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$pg" 2>/dev/null || true)"
            if [ "$status" = "healthy" ]; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "postgres did not become healthy in time" >&2
              exit 1
            fi
            sleep 2
          done
          echo "==> postgres is healthy"

          for endpoint in healthz readyz; do
            for i in $(seq 1 90); do
              if curl -fsS "http://localhost:${TIERL_PORT}/${endpoint}" >/dev/null 2>&1; then
                break
              fi
              if [ "$i" -eq 90 ]; then
                echo "GET /${endpoint} did not return 200 in time" >&2
                exit 1
              fi
              sleep 2
            done
            echo "==> GET /${endpoint}"
            curl -fsS "http://localhost:${TIERL_PORT}/${endpoint}"
            echo
          done
